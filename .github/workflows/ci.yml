name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.3"

jobs:
  checks:
    name: Quality, UI tests and Allure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HEADLESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Set up Python and restore Poetry cache
        id: setup_python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Select Python for Poetry
        run: |
          poetry env use "${{ steps.setup_python.outputs.python-path }}"
          poetry run python --version

      - name: Check Poetry configuration and lock file
        run: poetry check --lock

      - name: Install project dependencies
        run: poetry install --no-interaction --no-root

      - name: Select Allure report directory
        id: report
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "subfolder=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "name=UI tests PR #${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "subfolder=main" >> "$GITHUB_OUTPUT"
            echo "name=UI tests main" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting with Ruff
        run: poetry run ruff format --check .

      - name: Run Ruff linter
        run: poetry run ruff check --output-format=github .

      - name: Run mypy
        run: poetry run mypy .

      - name: Create environment file
        run: cp .env.example .env

      - name: Install Playwright browsers and system dependencies
        run: >
          poetry run python -m playwright install --with-deps
          chromium
          firefox
          webkit

      - name: Run regression UI tests
        id: ui_tests
        run: >
          poetry run pytest
          tests
          --ignore=tests/pytest
          --numprocesses auto
          -m regression
          --alluredir=allure-results
          --clean-alluredir

      - name: Restore UI Coverage history
        if: ${{ !cancelled() && steps.ui_tests.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: coverage-history.json
          key: ui-coverage-history-main-${{ github.run_id }}
          restore-keys: |
            ui-coverage-history-main-

      - name: Generate UI Coverage report
        id: coverage_report
        if: ${{ !cancelled() && steps.ui_tests.outcome == 'success' }}
        run: poetry run ui-coverage-tool save-report

      - name: Save UI Coverage history
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: coverage-history.json
          key: ui-coverage-history-main-${{ github.run_id }}

      - name: Upload UI Coverage report
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage-report
          path: |
            coverage.html
            coverage-report.json
          retention-days: 30

      - name: Get Allure history
        if: ${{ !cancelled() && steps.ui_tests.outcome != 'skipped' }}
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Prepare Allure history
        if: ${{ !cancelled() && steps.ui_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          rm -rf gh-pages/.git
          mkdir -p gh-pages
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            rm -rf "gh-pages/${{ steps.report.outputs.subfolder }}"
          fi
          echo '<meta http-equiv="refresh" content="0; url=./main/">' > gh-pages/index.html

      - name: Add UI Coverage report to GitHub Pages
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          mkdir -p gh-pages/ui-coverage
          cp coverage.html gh-pages/ui-coverage/coverage.html
          cp coverage-report.json gh-pages/ui-coverage/coverage-report.json

      - name: Generate Allure report
        id: allure_report
        if: ${{ !cancelled() && steps.ui_tests.outcome != 'skipped' }}
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: ${{ steps.report.outputs.subfolder }}
          report_name: ${{ steps.report.outputs.name }}
          keep_reports: 100

      - name: Publish reports to GitHub Pages
        id: publish_report
        if: ${{ !cancelled() && steps.allure_report.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Add report links to workflow summary
        if: ${{ !cancelled() && steps.publish_report.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo "## Allure report"
            echo
            echo "[Open ${{ steps.report.outputs.name }}](${{ steps.report.outputs.url }})"

            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo
              echo "## UI Coverage"
              echo
              echo "[Open UI Coverage report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ui-coverage/coverage.html)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"